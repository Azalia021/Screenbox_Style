# Screenbox_Style configuration (modernz.conf)
# Emulating the UI layout and Fluent Design visual language of Screenbox (https://github.com/stinus-dev/Screenbox)

# Language and display
# set language (for available options, see modernz-locale.json)
language=default
# UI font (Inter ships in the fonts folder)
font=Inter

# show mpv logo when idle
idlescreen=yes
# show OSC window top bar: "auto", "yes", or "no" (displays filename in top bar; caption controls appear when borderless/fullscreen)
window_top_bar=yes
# show OSC when windowed
showwindowed=yes
# show OSC when fullscreen
showfullscreen=yes
# show OSC when a select menu is open
showonselect=no
# show OSC when paused
showonpause=yes
# keep OSC visible while paused: no, bottombar, both
keeponpause=both

# OSC behaviour and scaling
# time (in ms) before OSC hides if no mouse movement
hidetimeout=1500
# keep OSC visible while cursor hovers over bottom or top bar
keep_with_cursor=yes
# fade-out duration (in ms), set to 0 for no fade
fadeduration=200
# whether to enable fade-in effect
fadein=yes
# minimum mouse movement (in pixels) required to show OSC
minmousemove=0
# controls how much of the window ignores mouse movement for showing the osc
# 0.0 always shows on movement, 1.0 only shows when directly hovered
deadzonesize=0.0
# hide behavior when cursor enters deadzone or leaves window: instant or timeout
deadzone_hide=timeout
# show OSC when seeking
osc_on_seek=yes
# show OSC/window controls on start of every file (no, bottom, top, both)
osc_on_start=both
# pause video while seeking with mouse move (on button hold)
mouse_seek_pause=yes
# force show seekbar tooltip on mouse drag, even if not hovering seekbar
force_seek_tooltip=no

# scale osc with the video
vidscale=auto
# osc scale factor when windowed
scalewindowed=1.0
# osc scale factor when fullscreen
scalefullscreen=1.0
# largest size when scaling with the video, in screen pixels per unit times the system's
# display scaling, so the controls are the same size on every display (0 = no limit)
vidscale_max=1.35

# Elements display
# show title in the OSC
show_title=yes
# title: "${media-title}" or "${filename}"
title=${media-title}
# font size of the title text (20px SubtitleTextBlockStyle in Screenbox)
title_font_size=20
# truncate title with ellipsis if it overflows
truncate_title=yes
# chapter title font size
chapter_title_font_size=14
# show cached time information
cache_info=no
# show cache speed per second
cache_info_speed=no
# font size of the cache information
cache_info_font_size=12

# show chapter title (v1.0 disabled by default, deferred to v2.0 REQ-BOT-02)
show_chapter_title=no
# show chapter above title
chapter_above_title=no
# format for chapter display on seekbar hover (set to "no" to disable)
chapter_fmt=%s

# show current time instead of remaining time
timecurrent=yes
# show timecodes with milliseconds
timems=no
# use the Unicode minus sign in remaining time
unicodeminus=no
# "dynamic" or "fixed". dynamic shows MM:SS when possible, fixed always shows HH:MM:SS
time_format=dynamic
# font size of the time display
time_font_size=14
# tooltips font size
tooltip_font_size=13
# speed button font size
speed_font_size=15

# Title bar settings
# show window title (filename) in top bar (REQ-OTH-01)
show_window_title=yes
# window title font size (20px SubtitleTextBlockStyle in Screenbox)
window_title_font_size=20
# show window controls (close, minimize, maximize) in borderless/fullscreen
window_controls=yes
# show window controls (top bar) and bottom bar independently on hover (no = synchronous fade in/out per REQ-OTH-02)
windowcontrols_independent=no

# Subtitle and OSD display settings
# IMPORTANT: It is recommended to add the following
# in your mpv.conf, to circumvent subtitle or OSD
# bad positioning when watch later options are used
# watch-later-options-remove=sub-pos
# watch-later-options-remove=osd-margin-y

# raise subtitles above the OSC when shown (off by default to keep subtitle position untouched)
sub_margins=no
# dynamically shift OSD with top/bottom bar visibility (off by default; uses static osd_margin_y below instead)
osd_margins=no
# static vertical OSD margin (in mpv 720p OSD units) so top-left Volume% stays permanently below the top bar (0 = keep mpv default)
osd_margin_y=60
# hide mpv's built-in wide OSD bar (e.g. volume/seek bar) while keeping OSD text
hide_osd_bar=yes
# update margins dynamically with OSC visibility
dynamic_margins=yes

# Buttons display and functionality
# show the subtitles menu button (REQ-BOT-05)
subtitles_button=yes
# show the audio tracks menu button (REQ-BOT-05)
audio_tracks_button=yes
# show the jump backward and forward buttons
jump_buttons=no
# change the jump amount in seconds
jump_amount=10
# change the jump amount in seconds on right click
jump_more_amount=60
# show different icon when jump_amount is set to 5, 10, or 30
jump_icon_number=yes
# seek mode for jump buttons: "relative" or "exact"
jump_mode=relative
# enable continuous jumping when holding down seek buttons
jump_softrepeat=yes
# show the chapter skip backward and forward buttons
chapter_skip_buttons=no
# show next/previous playlist track buttons (REQ-BOT-01)
track_nextprev_buttons=yes

# show mute button and volume slider (REQ-BOT-03)
volume_control=yes
# volume scale type: "linear" or "logarithmic"
volume_control_type=linear
# unmute audio when adjusting volume slider with left click
volumebar_unmute_on_click=no
# show folder playlist button in bottom bar (REQ-TOP-02)
playlist_button=yes
# hide playlist button when no playlist exists
hide_empty_playlist_button=no
# gray out the playlist button when no playlist exists
gray_empty_playlist_button=no

# show fullscreen toggle button (REQ-BOT-07)
fullscreen_button=yes
# show info button
info_button=yes
# show window on top / PiP button (REQ-BOT-06)
ontop_button=yes
# move ontop button to top bar when ontop is active
ontop_in_topbar=no
# show screenshot button
screenshot_button=yes
# show settings / more button on the far right of the bottom bar (REQ-BOT-08)
settings_button=yes

# show file loop button (v1.0 disabled by default, deferred to v2.0 REQ-BOT-04)
loop_button=no
# show shuffle button (v1.0 disabled by default, deferred to v2.0 REQ-BOT-04)
shuffle_button=no
# show speed control in menu
speed_button=yes

# force buttons to always be active. can add: playlist_prev,playlist_next
buttons_always_active=playlist_prev,playlist_next

# icon size for the play/pause button
playpause_size=22
# icon size for the middle buttons
midbuttons_size=20
# icon size for the side buttons
sidebuttons_size=20

# Colors and style (Fluent Design / Screenbox dark theme)
# accent color of the OSC and title bar
osc_color=#202020
# color of the title in top bar
window_title_color=#FFFFFF
# color of the window controls (close, minimize, maximize)
window_controls_color=#FFFFFF
# color of close window control on hover (Fluent red #C42B1C)
windowcontrols_close_hover=#C42B1C
# color of maximize window controls on hover
windowcontrols_max_hover=#FFFFFF
# color of minimize window controls on hover
windowcontrols_min_hover=#FFFFFF
# color of the title
title_color=#FFFFFF
# color of the cache information
cache_info_color=#FFFFFF
# color of the cache ranges on the seekbar
seekbar_cache_color=#888888
# color of the seekbar progress (Fluent WinUI 3 dark theme accent light2 #60CDFF)
seekbarfg_color=#60CDFF
# color of the remaining seekbar
seekbarbg_color=#FFFFFF
# color of the seekbar handle inner circle
seek_handle_color=#60CDFF
# outer border ring color drawn around the seekbar handle (set to disable to disable)
seek_handle_border_color=#454545
# match volume bar color with seekbar accent color like Screenbox
volumebar_match_seek_color=yes
# color of the timestamps
time_color=#FFFFFF
# color of the chapter title
chapter_title_color=#CCCCCC
# color of the side buttons (audio, subtitles, playlist, etc.)
side_buttons_color=#FFFFFF
# color of the middle buttons (skip, jump, chapter, etc.)
middle_buttons_color=#FFFFFF
# color of the play/pause button
playpause_color=#FFFFFF
# color of the element when held down (pressed)
held_element_color=#CCCCCC
# color of a hovered button when hover_effect includes "color"
hover_effect_color=#FFFFFF
# color of chapter nibbles on the seekbar
nibble_color=#60CDFF
# color of the current chapter nibble on the seekbar
nibble_current_color=#FFFFFF
# color of the A/B loop range on the seekbar
ab_loop_color=#60CDFF

# Button interaction settings
# active button hover effects: glow, size, color, box; can use multiple separated by commas
hover_effect=box
# relative size of a hovered button if "size" effect is active
button_hover_size=108
# relative size of a button when held/pressed. below 100 shrinks button when held down
button_held_size=95
# alpha of the hover background box when a button is held down
button_held_box_alpha=12
# glow intensity when "glow" hover effect is active
button_glow_amount=5
# relative size of a hovered slider handle (100 = no size change)
slider_hover_size=110
# enable tooltips for most buttons. seek and volume tooltips are always enabled
tooltip_hints=yes

# Progress bar settings
# size ratio of the seekbar handle (range: 0 ~ 1)
seek_handle_size=0.85
# border thickness as a fraction of the handle radius
seek_handle_border_size=0.35
# border thickness when handle is hovered (set equal to seek_handle_border_size to disable)
seek_handle_border_hover_size=0.25
# seekbar height preset: small, medium, large, xlarge
seekbar_height=medium
# show seek range overlay
seekrange=yes
# transparency of the seek range
seekrangealpha=150
# update chapter markers on the seekbar when duration changes
livemarkers=yes
# use keyframes when dragging the seekbar
seekbarkeyframes=yes
# rounded corners seekbar slider
slider_rounded_corners=yes

# chapter nibble style: "gap", "triangle", "bar" or "single-bar"
nibbles_style=gap
# top chapter nibbles above seekbar
nibbles_top=yes
# bottom chapter nibbles below seekbar
nibbles_bottom=yes

# automatically set keyframes for the seekbar based on video length
automatickeyframemode=yes
# videos longer than this (in seconds) will have keyframes on the seekbar
automatickeyframelimit=600

# always show a small progress line at the bottom of the screen
persistent_progress=no
# height of the persistent progress bar
persistent_progress_height=17
# show cached buffer status in the persistent progress line
persistent_buffer=no

# Miscellaneous settings
# only used at init to set visibility_mode(...)
visibility=auto
# visibility modes to cycle through, modes are separated by _
visibility_modes=never_auto_always
# minimum interval between OSC redraws (in seconds)
tick_delay=0.0167
# use display FPS as the minimum redraw interval
tick_delay_follow_display_fps=yes

# Elements Position
# Useful when adjusting font size or type

# title vertical offset relative to seekbar
title_offset=20
# title vertical offset if a chapter title is below it
title_with_chapter_offset=5
# chapter title vertical offset relative to seekbar
chapter_title_offset=18
# chapter offset when shown above title
chapter_above_title_offset=3
# time codes vertical offset relative to seekbar
time_codes_offset=0
# tooltip height position offset
tooltip_height_offset=5
# portrait window width trigger to move some elements
portrait_window_trigger=950
# hide volume bar trigger window width (720 matches Screenbox AdaptiveControlStates)
hide_volume_bar_trigger=720
# osc height (104px matches Screenbox PlayerControls)
osc_height=104

# Window & popup menu look (Screenbox non-floating gradient bars + opaque dark flyout menus)
# software rounded window corners mask in windowed mode (off by default: Windows 11 DWM rounds corners natively without cutting into the close button)
window_rounded_corners=no
# corner radius of the window in layout units
window_corner_radius=10
# solid dark flyout menu surface color (#2C2C2C BackgroundAcrylicTintFallbackColor in Screenbox)
glass_color=#2C2C2C
# menu surface opacity in percent (100 = opaque default menus)
glass_opacity=100
# opacity of the hairline light edge around popup menus in percent
glass_border_opacity=10
# soft shadow under popup menus
glass_shadow=yes
# color of secondary text: duration, chapter title, menu details
muted_text_color=#C5C5C5
# show track, playlist, chapter and audio output lists as ModernZ menus instead of mpv's select lists
modern_menus=yes
# rows a menu shows before it scrolls
menu_max_items=9

## Mouse commands

# title mouse actions
title_mbtn_left_command=script-binding stats/display-page-5
title_mbtn_mid_command=show-text ${path}
title_mbtn_right_command=script-binding select/select-watch-history

# chapter title mouse actions
chapter_title_mbtn_left_command=script-binding select/select-chapter
chapter_title_mbtn_right_command=show-text ${chapter-list} 3000

# seekbar wheel actions
seekbar_wheel_up_command=seek 10
seekbar_wheel_down_command=seek -10

# playlist button mouse actions (REQ-TOP-02: Folder Playlist)
playlist_mbtn_left_command=script-binding select/select-playlist
playlist_mbtn_right_command=script-binding select/menu

# volume mouse actions (REQ-BOT-03)
vol_ctrl_mbtn_left_command=no-osd cycle mute
vol_ctrl_mbtn_right_command=script-binding select/select-audio-device
vol_ctrl_wheel_down_command=osd-msg add volume -5
vol_ctrl_wheel_up_command=osd-msg add volume 5
volumebar_wheel_down_command=osd-msg add volume -5
volumebar_wheel_up_command=osd-msg add volume 5

# audio button mouse actions (REQ-BOT-05)
audio_track_mbtn_left_command=script-binding select/select-aid
audio_track_mbtn_mid_command=cycle audio down
audio_track_mbtn_right_command=cycle audio
audio_track_wheel_down_command=cycle audio
audio_track_wheel_up_command=cycle audio down

# subtitle button mouse actions (REQ-BOT-05)
sub_track_mbtn_left_command=script-binding select/select-sid
sub_track_mbtn_mid_command=cycle sub down
sub_track_mbtn_right_command=cycle sub
sub_track_wheel_down_command=cycle sub
sub_track_wheel_up_command=cycle sub down

# play/pause button mouse actions (REQ-BOT-01)
play_pause_mbtn_left_command=cycle pause
play_pause_mbtn_mid_command=cycle-values loop-playlist inf no
play_pause_mbtn_right_command=cycle-values loop-file inf no

# chapter skip buttons mouse actions
chapter_prev_mbtn_left_command=add chapter -1
chapter_prev_mbtn_mid_command=show-text ${chapter-list} 3000
chapter_prev_mbtn_right_command=script-binding select/select-chapter

chapter_next_mbtn_left_command=add chapter 1
chapter_next_mbtn_mid_command=show-text ${chapter-list} 3000
chapter_next_mbtn_right_command=script-binding select/select-chapter

# playlist skip buttons mouse actions (REQ-BOT-01)
playlist_prev_mbtn_left_command=playlist-prev
playlist_prev_mbtn_mid_command=show-text ${playlist} 3000
playlist_prev_mbtn_right_command=script-binding select/select-playlist

playlist_next_mbtn_left_command=playlist-next
playlist_next_mbtn_mid_command=show-text ${playlist} 3000
playlist_next_mbtn_right_command=script-binding select/select-playlist

# fullscreen button mouse actions (REQ-BOT-07)
fullscreen_mbtn_left_command=cycle fullscreen
fullscreen_mbtn_right_command=cycle window-maximized

# info button mouse actions
info_mbtn_left_command=script-binding stats/display-page-1-toggle

# ontop (pin / PiP) button mouse actions (REQ-BOT-06)
ontop_mbtn_left_command=osd-msg cycle ontop

# screenshot button mouse actions
screenshot_mbtn_left_command=osd-msg screenshot video

# loop file button mouse actions
file_loop_mbtn_left_command=osd-msg cycle-values loop-file inf no
file_loop_mbtn_right_command=osd-msg cycle-values loop-playlist inf no

# speed button mouse actions
speed_mbtn_left_command=osd-msg add speed 1
speed_mbtn_right_command=osd-msg set speed 1
speed_wheel_down_command=osd-msg add speed -0.25
speed_wheel_up_command=osd-msg add speed 0.25

# settings (more) button mouse actions (REQ-BOT-08: triggers mpv context menu)
more_mbtn_left_command=context-menu
more_mbtn_right_command=script-binding select/context-menu
